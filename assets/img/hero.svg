<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" role="img" aria-label="SAMUEL RUSSO placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15130F"/>
      <stop offset="0.55" stop-color="#0E0D0B"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <rect width="1920" height="1200" fill="url(#halo)"/>
  <g stroke="#F4F1EA" stroke-opacity="0.06">
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="1200"/>
  </g>
  <rect width="1920" height="1200" filter="url(#grain)" opacity="0.5"/>
  <g font-family="'Space Grotesk',Arial,sans-serif" fill="#F4F1EA">
    <text x="960" y="1120" text-anchor="middle" font-size="24" letter-spacing="6" fill-opacity="0.20">IMAGE / VIDÉO CINÉMATOGRAPHIQUE — EMPLACEMENT À REMPLACER</text>
  </g>
  <rect x="8" y="8" width="1904" height="1184" fill="none" stroke="#F4F1EA" stroke-opacity="0.10"/>
</svg>
