<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SAMUEL RUSSO FINANCE placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15130F"/>
      <stop offset="0.55" stop-color="#0E0D0B"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <g stroke="#F4F1EA" stroke-opacity="0.06">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5"/>
  <g font-family="'Space Grotesk',Arial,sans-serif" fill="#F4F1EA">
    <text x="600" y="315" text-anchor="middle" dominant-baseline="middle" font-size="69" font-weight="600" letter-spacing="-1" fill-opacity="0.9">SAMUEL RUSSO FINANCE</text>
    <text x="600" y="378" text-anchor="middle" font-size="20" letter-spacing="4" fill-opacity="0.42">CONSEILLER EN SECURITE FINANCIERE</text>
  </g>
  <rect x="8" y="8" width="1184" height="614" fill="none" stroke="#F4F1EA" stroke-opacity="0.10"/>
</svg>
