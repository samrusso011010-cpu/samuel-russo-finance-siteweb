<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="1:00 placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15130F"/>
      <stop offset="0.55" stop-color="#0E0D0B"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#halo)"/>
  <g stroke="#F4F1EA" stroke-opacity="0.06">
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect width="640" height="400" filter="url(#grain)" opacity="0.5"/>
  <g font-family="'Space Grotesk',Arial,sans-serif" fill="#F4F1EA">
    <text x="320" y="200" text-anchor="middle" dominant-baseline="middle" font-size="44" font-weight="600" letter-spacing="-1" fill-opacity="0.9">1:00</text>
    <text x="320" y="240" text-anchor="middle" font-size="12" letter-spacing="4" fill-opacity="0.42">CAPSULE - REMPLACER</text>
  </g>
  <rect x="8" y="8" width="624" height="384" fill="none" stroke="#F4F1EA" stroke-opacity="0.10"/>
</svg>
