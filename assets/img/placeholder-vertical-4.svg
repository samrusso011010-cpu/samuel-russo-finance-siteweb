<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="9:16 placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15130F"/>
      <stop offset="0.55" stop-color="#0E0D0B"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <rect width="360" height="640" fill="url(#halo)"/>
  <g stroke="#F4F1EA" stroke-opacity="0.06">
    <line x1="0" y1="320" x2="360" y2="320"/>
    <line x1="180" y1="0" x2="180" y2="640"/>
  </g>
  <rect width="360" height="640" filter="url(#grain)" opacity="0.5"/>
  <g font-family="'Space Grotesk',Arial,sans-serif" fill="#F4F1EA">
    <text x="180" y="320" text-anchor="middle" dominant-baseline="middle" font-size="39" font-weight="600" letter-spacing="-1" fill-opacity="0.9">9:16</text>
    <text x="180" y="356" text-anchor="middle" font-size="11" letter-spacing="4" fill-opacity="0.42">VERTICAL - REMPLACER</text>
  </g>
  <rect x="8" y="8" width="344" height="624" fill="none" stroke="#F4F1EA" stroke-opacity="0.10"/>
</svg>
